# Keeps the free-tier Supabase project from auto-pausing after 7 days of inactivity.
# Runs a tiny read query every 3 days. Uses only the public publishable key (RLS-protected).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *" # every 3 days, 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://czmjxsojbomkqtluzhru.supabase.co/rest/v1/countries?select=id&limit=1" \
            -H "apikey: sb_publishable_0Si3tv3sIjXRqqsiYqojcw_fS8eDN5t")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
